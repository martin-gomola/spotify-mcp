<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Spotify results</title>
</head>
<body>
  <div class="app-shell">
    <header class="header">
      <div class="heading">
        <span class="mark" aria-hidden="true"></span>
        <div class="heading-copy">
          <h1 id="title">Spotify results</h1>
          <p id="summary" class="summary">Preparing results...</p>
        </div>
      </div>
      <div id="device" class="device"></div>
    </header>
    <main id="results" class="results" aria-labelledby="title" aria-describedby="summary"></main>
    <p id="feedback" class="feedback" aria-live="polite"></p>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
