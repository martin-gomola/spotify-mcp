skill: build-spotify-playlist
cases:
  - name: liked_songs_road_trip
    prompt: "Build a road-trip playlist from my Liked Songs"
    expectations:
      - "Uses spotify_sample_liked_songs rather than only the newest saved page."
      - "Preserves exact recording URIs and shapes a driving arc."
      - "Creates public by default unless the user explicitly requests private."
      - "Re-reads the complete playlist and reports verification state."
  - name: ambiguous_write
    prompt: "The add tool returned ambiguous"
    expectations:
      - "Does not repeat the write automatically."
      - "Reads the playlist and compares exact intended versus observed URIs."
  - name: accepted_public_visibility
    prompt: "Spotify still shows the new playlist as public. That's fine; keep adding the tracks."
    expectations:
      - "Treats public visibility as accepted and continues the requested playlist-content work."
      - "Does not retry privacy updates, re-read visibility, inspect the plugin request path, or search for a private-creation workaround."
      - "Still verifies the final track URIs and order independently of visibility."
  - name: verified_dj_apply_renders
    prompt: "Apply the reviewed DJ order and show me the result."
    expectations:
      - "Applies the approved plan, then freshly verifies every exact playlist URI and position."
      - "When MCP Apps are supported, calls spotify_render_results exactly once after verification and before the textual completion response."
      - "Renders only the final playlist entity with kind: playlist; it does not treat a Markdown link as equivalent."
      - "Falls back to the canonical Spotify link only when the renderer is unavailable or the single render call fails."
threshold: { pass_rate: 1.0 }
